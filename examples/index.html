<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relocator | Source explorer</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #080808; color: #f2f2f2; font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 820px; margin: auto; padding: 48px 24px; }
  h1 { font-size: clamp(36px, 8vw, 66px); line-height: 1; letter-spacing: -.055em; margin: 22px 0; }
  .tag, h1 span { color: #ff4545; }
  .tag, small { font-family: monospace; }
  p, small { color: #bdbdbd; }
  label { display: block; margin-top: 28px; }
  form div { display: flex; gap: 10px; margin: 8px 0; flex-wrap: wrap; }
  input, button { padding: 12px; font: inherit; border: 1px solid #666; }
  input { flex: 1; min-width: min(250px, 100%); background: #111; color: #fff; }
  button { cursor: pointer; background: #fff; color: #080808; }
  .example { background: #151515; color: #ddd; margin: 6px 6px 6px 0; }
  :focus-visible { outline: 2px solid #ff4545; outline-offset: 3px; }
  article { border: 1px solid #444; padding: 14px 18px; margin: 12px 0; }
  article p { white-space: pre-wrap; }
</style>
<main>
  <p class="tag">RELOCATOR / FICTIONAL DATA DEMO</p>
  <h1>Search relocation <span>sources.</span></h1>
  <p>Explore fictional housing and incident records. Each result shows its source and provenance. This demo performs local text retrieval.</p>
  <form id="search">
    <label for="query">Search the sample records</label>
    <div>
      <input id="query" maxlength="4000" placeholder="Cedar Bay studio" required>
      <button type="submit">Find sources</button>
    </div>
  </form>
  <button class="example" data-query="Cedar Bay studio">Try housing</button>
  <button class="example" data-query="Amber County">Try incident records</button>
  <p id="status" role="status">Ready to search</p>
  <section id="records" aria-label="Matching source records"></section>
</main>
<script>
  const form = document.querySelector('#search');
  const query = document.querySelector('#query');
  const status = document.querySelector('#status');
  const records = document.querySelector('#records');
  const buttons = [...document.querySelectorAll('button')];
  document.querySelectorAll('.example').forEach(button => {
    button.addEventListener('click', () => {
      query.value = button.dataset.query;
      form.requestSubmit();
    });
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    buttons.forEach(button => { button.disabled = true; });
    records.replaceChildren();
    status.textContent = 'Searching…';
    try {
      const response = await fetch('/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: query.value})
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Search failed');
      status.textContent = result.sources.length ? 'Matching fictional records' : 'No matching records found';
      for (const source of result.sources) {
        const record = document.createElement('article');
        const label = document.createElement('small');
        const excerpt = document.createElement('p');
        label.textContent = source.id + ' / ' + source.provenance;
        excerpt.textContent = source.excerpt;
        record.append(label, excerpt);
        records.append(record);
      }
    } catch (error) {
      status.textContent = error.message;
    } finally {
      buttons.forEach(button => { button.disabled = false; });
    }
  });
</script>
</html>
